<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Build Your NOOK | 3D Configurator</title>
    <meta
      name="description"
      content="Tailor every square metre to match your lifestyle. Choose your design, roof, specifications, palette and upgrades, and see your instant build estimate."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOOK Pods" />
    <meta property="og:title" content="Build Your NOOK | The Pavilion" />
    <meta
      property="og:description"
      content="Choose your roof, specification, colour palette and upgrades, turn your NOOK through 360 degrees and see your instant build estimate."
    />
    <meta property="og:url" content="https://hzia1938-spec.github.io/nook-configurator/" />
    <meta property="og:image" content="https://hzia1938-spec.github.io/nook-configurator/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..700&display=swap"
    />
    <link rel="stylesheet" href="assets/css/configurator.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="NOOK Pods configurator home">
        <img
          src="assets/brand/nook-pods-logo-black.svg"
          alt="NOOK Pods"
          width="150"
          height="48"
        />
      </a>
      <p class="header-title">
        3D Configurator
        <span class="test-badge">Test build</span>
      </p>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Instant build estimate</p>
        <h1 class="intro-title" id="page-title">Build Your NOOK</h1>
        <p class="intro-text">
          Tailor every square metre to match your lifestyle. Choose your finish,
          layout and off-grid package in real time.
        </p>
      </section>

      <div class="configurator">
        <section class="stage-column" aria-label="Your pod">
          <p class="eyebrow stage-eyebrow">3D build configurator</p>
          <div class="stage" id="stage">
            <div class="stage-layers" id="stage-layers" role="img"></div>
            <div class="stage-spin" id="spin-view" hidden>
              <img id="spin-image" alt="" draggable="false" />
            </div>
            <p class="stage-caption" id="stage-caption"></p>
            <div class="spin-controls" id="spin-controls" hidden>
              <button
                class="spin-arrow"
                id="spin-left"
                type="button"
                aria-label="Turn left"
              ></button>
              <span class="spin-hint">Drag to turn</span>
              <button
                class="spin-arrow is-right"
                id="spin-right"
                type="button"
                aria-label="Turn right"
              ></button>
            </div>
            <div class="stage-actions">
              <button
                class="stage-button"
                id="spin-toggle"
                type="button"
                aria-pressed="false"
                hidden
              >
                360 view
              </button>
              <button class="stage-button" id="stage-play" type="button">
                Watch it build
              </button>
            </div>
            <p class="stage-status" id="stage-status" role="status" hidden></p>
          </div>
          <div class="interior-strip" id="interior-strip" hidden></div>
          <div class="gallery" id="gallery">
            <p class="gallery-title">
              <span class="eyebrow">Inspiration gallery</span>
              <span class="gallery-hint">(Click to enlarge pictures on screen)</span>
            </p>
            <ul class="gallery-grid" id="gallery-grid"></ul>
          </div>
        </section>

        <section class="steps-column" aria-label="Configurator steps">
          <nav class="progress" id="progress" aria-label="Steps"></nav>
          <div class="steps" id="steps"></div>
        </section>
      </div>
    </main>

    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-labelledby="lightbox-caption"
      hidden
    >
      <div class="lightbox-inner">
        <button class="lightbox-close" id="lightbox-close" type="button">
          Close
        </button>
        <div class="lightbox-media" id="lightbox-media"></div>
        <p class="lightbox-caption" id="lightbox-caption"></p>
      </div>
    </div>

    <script src="assets/js/configurator.js" defer></script>
  </body>
</html>
